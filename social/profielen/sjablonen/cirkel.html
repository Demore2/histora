<!doctype html>
<!--
  Preview only: shows a picture cropped to a circle at the sizes the platforms
  use (profile header ~150px, next to a video/comment ~40px and ~24px), on light
  and dark backgrounds. ?bron=<path relative to the repo root>
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
      body { display: flex; }
      .vlak { flex: 1; display: flex; align-items: center; justify-content: center; gap: 48px; }
      .licht { background: #FFFFFF; }
      .donker { background: #000000; }
      img { border-radius: 50%; display: block; }
      .groot { width: 320px; height: 320px; }
      .midden { width: 40px; height: 40px; }
      .klein { width: 24px; height: 24px; }
    </style>
  </head>
  <body>
    <div class="vlak licht"><img class="groot" /><img class="midden" /><img class="klein" /></div>
    <div class="vlak donker"><img class="groot" /><img class="midden" /><img class="klein" /></div>
    <script>
      const bron = new URLSearchParams(location.search).get('bron') || 'assets/images/app-icon.png';
      document.querySelectorAll('img').forEach((i) => (i.src = `../../../${bron}`));
    </script>
  </body>
</html>
