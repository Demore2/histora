<!doctype html>
<!--
  YouTube watermark, 150x150 (Studio asks for at least 150x150, square, under 1 MB).
  The app icon in a circle with a thin parchment ring, so it stays separate from
  a busy or orange frame. Outside the circle is transparent.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 150px; height: 150px; overflow: hidden; background: transparent; }
      img {
        width: 142px; height: 142px; margin: 4px;
        border-radius: 50%; display: block;
        box-shadow: 0 0 0 4px #F7F1E4;
      }
    </style>
  </head>
  <body><img src="../../../assets/images/app-icon.png" alt="" /></body>
</html>
