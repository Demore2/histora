<!doctype html>
<!--
  De telefoon-screenshots voor de Play Store (1.3), als sjabloon.

  Zelfde aanpak als feature-graphic.html: dit bestand is de bron, de PNG's niet. Elke dia is
  1080×1920 (9:16, wat Play wil) en wordt door `npm run generate:store-screenshots` met headless
  Chrome gerenderd — één keer per dia, met `?n=1` t/m `?n=4`. Open hem in een browser met
  `?n=3` om één dia te bekijken.

  De schermen zelf zijn echte emulator-screenshots (`store/screenshots-bron/`, 1080×2400). De
  statusbalk daarvan wordt afgedekt: de emulator tekent hem wit op beige en dus onleesbaar.
  De vos komt uit `assets/images/vos/` — dezelfde plaatjes als de widget, geen nieuwe beelden.

  Geen aantallen in de koppen ("20 stories", "6 eras"): er komen verhalen bij, en een getal in
  de store veroudert stilletjes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Histora store screenshots</title>
<style>
  :root { --breed: 1080px; --hoog: 1920px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--breed); height: var(--hoog); overflow: hidden; background: #0B5E8A; }
  body { font-family: 'Segoe UI', Arial, sans-serif; }

  .dia {
    position: relative;
    width: var(--breed);
    height: var(--hoog);
    overflow: hidden;
    color: #fff;
  }
  /* Zachte cirkels achter de telefoon, zodat de achtergrond niet vlak oogt. */
  .dia::before, .dia::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
  }
  .dia::before { width: 900px; height: 900px; right: -320px; top: 520px; }
  .dia::after { width: 560px; height: 560px; left: -220px; top: 1180px; }

  .kop {
    position: absolute;
    left: 80px;
    right: 80px;
    top: 110px;
    text-align: center;
    z-index: 3;
  }
  .kop h1 { font-size: 92px; line-height: 1.04; font-weight: 800; letter-spacing: -1.5px; }
  .kop p { margin-top: 22px; font-size: 40px; line-height: 1.3; font-weight: 500; opacity: 0.92; }

  .telefoon {
    position: absolute;
    left: 50%;
    top: 520px;
    width: 640px;
    height: 1378px; /* 604 × 2400/1080 + 2 × 18 rand: het scherm vult de telefoon precies */
    transform: translateX(-50%);
    border-radius: 78px;
    background: #15120E;
    padding: 18px;
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.35), inset 0 0 0 3px #3A342C;
    z-index: 1;
  }
  .scherm {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 62px;
    overflow: hidden;
    background: #F7F1E4;
  }
  .scherm img { display: block; width: 100%; height: auto; }
  /* De eigen statusbalk over die van de emulator heen. */
  .status {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 56px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 24px;
    font-weight: 600;
    color: #211F1A;
    background: var(--statusbalk, #F7F1E4);
  }
  .status .rechts { display: flex; gap: 10px; align-items: center; }
  .status i { display: block; background: currentColor; border-radius: 3px; }
  .camera {
    position: absolute;
    left: 50%;
    top: 16px;
    width: 26px;
    height: 26px;
    margin-left: -13px;
    border-radius: 50%;
    background: #15120E;
  }

  .vos {
    position: absolute;
    width: 470px;
    height: 470px;
    z-index: 2;
    filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.28));
  }
  .vos.links { left: -60px; bottom: 30px; }
  .vos.rechts { right: -60px; bottom: 30px; }
  .vos.gespiegeld { transform: scaleX(-1); }

  /* Dia's met een Higgsfield-scène in plaats van de getekende telefoon. */
  .dia.met-scene::before, .dia.met-scene::after { display: none; }
  .scene {
    position: absolute;
    width: 1728px;   /* 1280 × 1,35: zo groot mogelijk zonder de vos of de telefoon af te snijden */
    left: -223px;    /* de telefoon staat rechts van het midden in de scène; zo blijft de vos heel */
    bottom: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 220px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 220px);
  }
</style>
</head>
<body>
<div class="dia" id="dia"></div>

<script>
  // Elke dia: kop, onderregel, achtergrond, welk scherm, welke vos en aan welke kant.
  const DIAS = [
    {
      kop: 'Learn history<br>every day',
      sub: 'Real stories about the people and moments that shaped our world.',
      van: '#0EA5E9', naar: '#075985',
      scherm: 'home.png', vos: 'zwaaiend.png', kant: 'links',
      scene: 'scenes/klaar/scene-1-home.png', achtergrond: '#FFEBC2', tekst: '#4A2C1A',
    },
    {
      kop: 'Stories that read<br>like a novel',
      sub: 'Short chapters with an illustrated scene to open each one.',
      van: '#FFEBC2', naar: '#FDD48E', tekst: '#4A2C1A',
      scherm: 'reader.png', vos: 'fase-2-ochtend.png', kant: 'rechts', spiegel: true,
    },
    {
      kop: 'Keep your<br>streak alive',
      sub: 'One chapter a day. The fox cheers you on.',
      van: '#22C55E', naar: '#166534',
      scherm: 'progress.png', vos: 'fase-1-gevierd.png', kant: 'links',
      // Hier staat de telefoon in het midden van de scène, dus gecentreerd: 540 − 640 × 1,35.
      scene: 'scenes/klaar/scene-2-streak.png', achtergrond: '#FFEBC2', tekst: '#4A2C1A', sceneLinks: -324,
    },
    {
      kop: 'Earn Ducats,<br>save your streak',
      sub: 'Read to earn coins and buy a streak freeze for busy days.',
      van: '#38BDF8', naar: '#1D4ED8',
      scherm: 'shop.png', vos: 'fase-8-ijs.png', kant: 'links',
      // Telefoon links-midden, vos op het ijsblok rechts: zo vallen allebei binnen de 1080 px.
      scene: 'scenes/klaar/scene-3-shop.png', achtergrond: '#FFEBC2', tekst: '#4A2C1A', sceneLinks: -550,
    },
  ];

  const n = Math.min(DIAS.length, Math.max(1, Number(new URLSearchParams(location.search).get('n')) || 1));
  const d = DIAS[n - 1];
  const dia = document.getElementById('dia');
  // Alle dia's in het warme verloop van de Higgsfield-scènes (Phoxy-stijl), met donkerbruine koppen.
  dia.style.background = `linear-gradient(180deg, ${d.van} 0%, ${d.naar} 100%)`;
  if (d.tekst) dia.style.color = d.tekst;
  if (d.statusbalk) dia.style.setProperty('--statusbalk', d.statusbalk);

  const statusKleur = '#211F1A';
  if (d.scene) {
    // Een Higgsfield-scène: vos + telefoon + achtergrond in één beeld, het echte scherm er al in
    // gezet door scripts/plaats-scherm.mjs. Het beeld is vierkant; erboven loopt de effen kleur
    // van zijn bovenrand door, met een zachte overgang zodat er geen naad te zien is.
    dia.classList.add('met-scene');
    dia.style.background = d.achtergrond;
    dia.style.color = d.tekst;
    dia.innerHTML = `
      <div class="kop"><h1>${d.kop}</h1><p>${d.sub}</p></div>
      <img class="scene" src="${d.scene}" alt=""${d.sceneLinks != null ? ` style="left:${d.sceneLinks}px"` : ''}>
    `;
  } else dia.innerHTML = `
    <div class="kop"><h1>${d.kop}</h1><p>${d.sub}</p></div>
    <div class="telefoon">
      <div class="scherm">
        <img src="screenshots-bron/${d.scherm}" alt="">
        <div class="status" style="color:${statusKleur}">
          <span>9:41</span>
          <span class="rechts">
            <i style="width:6px;height:10px"></i><i style="width:6px;height:15px"></i><i style="width:6px;height:20px"></i>
            <i style="width:40px;height:20px;border-radius:6px;margin-left:8px"></i>
          </span>
        </div>
        <div class="camera"></div>
      </div>
    </div>
    <img class="vos ${d.kant}${d.spiegel ? ' gespiegeld' : ''}" src="../assets/images/vos/${d.vos}" alt="">
  `;
</script>
</body>
</html>
